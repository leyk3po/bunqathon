services:
  db:
    image: postgres:16-alpine
    container_name: flashdrop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashdrop
      POSTGRES_USER: flashdrop
      POSTGRES_PASSWORD: flashdrop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashdrop -d flashdrop"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
